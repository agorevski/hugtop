[package]
name = "hugtop"
version = "0.1.0"
edition = "2024"
autobins = false
description = "A polished terminal dashboard for local Hugging Face models"
license = "MIT"
repository = "https://github.com/agorevski/HuggingFaceModelDashboard"
keywords = ["huggingface", "tui", "models", "dashboard"]
categories = ["command-line-utilities"]

[[bin]]
name = "hugtop"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
